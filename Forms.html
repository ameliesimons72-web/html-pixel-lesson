<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Form</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>

    <h1>Student Information Form</h1>
    <form action="submit_form.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="100" required><br><br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Prefer not to say</option>
        </select><br><br>

        <p>Choose your preferred learning mode:</p>

        <label>
            <input type="radio" name="learning_mode" value="online" required>
            Online
        </label>
        <label>
            <input type="radio" name="learning_mode" value="physical" required>
            Physical
        </label>

        <label for="interests">Interests:</label><br>
            <textarea id="interests" name="interests" rows="4" cols="50"></textarea><br><br>

            <button type="submit">Submit</button>
            <button type="reset">Clear Form</button>
        
    </form>

</body>
</html>
