<!DOCTYPE html>
<html lang="en">
<head>

    <title>List</title>
</head>
<body>
    <h1>unordered lists</h1>
    <ul>
        <li>reading novels</li>
        <li>playing video games</li>
        <li>watching movies</li>
    </ul>
    <h2>ordered lists</h2>

        <li>create a new file</li>
        <li>save the file</li>
    </ol>
</body>
</html>
